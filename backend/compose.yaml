services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scesi
      POSTGRES_PASSWORD: scesi
      POSTGRES_DB: scesi_events
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - scesi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scesi -d scesi_events"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scesi_postgres_data:
